# ── Jarvis ERP — nginx reverse proxy (TLS via certbot) ─────────────
#
# Alternative to Caddy for teams already standardised on nginx. Unlike
# Caddy, nginx does NOT fetch certificates itself — you run certbot once
# (it injects the ssl_certificate lines and installs an auto-renew
# timer). See deploy/TLS_SETUP.md for the certbot step.
#
# Install:
#   sudo cp deploy/nginx-jarvis.conf /etc/nginx/sites-available/jarvis
#   sudo ln -s /etc/nginx/sites-available/jarvis /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.baluelastics.com   # provisions the cert
#   sudo nginx -t && sudo systemctl reload nginx
#
# Prerequisites: DNS A record api.baluelastics.com → 3.6.171.27;
# inbound 80+443 open, 2701 closed to the public; app HOST=127.0.0.1.

# Redirect all plaintext to HTTPS.
server {
    listen 80;
    server_name api.baluelastics.com;
    # certbot uses this path for the ACME http-01 challenge.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name api.baluelastics.com;

    # ── TLS ── certbot fills these in (--nginx). If configuring by hand,
    # point them at your fullchain.pem / privkey.pem.
    # ssl_certificate     /etc/letsencrypt/live/api.baluelastics.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.baluelastics.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Allow the 5 MB multer uploads (default is 1 MB → 413 on OCR import).
    client_max_body_size 6m;

    # Basic hardening headers (helmet already sets app-level ones).
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:2701;
        proxy_http_version 1.1;

        # Real client info for the app's `trust proxy` (protocol + IP).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }
}
